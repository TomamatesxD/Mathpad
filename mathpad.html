<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Entorno de Estudio Matemático</title>
    <!-- Favicon en formato Data URI (SVG integrado) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23bb86fc' stroke-width='1.55' stroke-linecap='round' stroke-linejoin='round'><g transform='translate(4.9, 11.5) scale(0.58, 0.35)'><path d='M12 8 C 12 5.5 14 4 16 4'/><path d='M12 8 V 16'/><path d='M12 16 C 12 18.5 10 20 8 20'/><circle cx='15.8' cy='4.6' r='1.3' fill='%23bb86fc' stroke='none'/><circle cx='8.2' cy='19.4' r='1.3' fill='%23bb86fc' stroke='none'/></g><path d='M13.25 8.55L16.05 2.85'/><path d='M14.15 8.85L17.05 3.15'/><path d='M16.05 2.85 L16.35 2.15 Q16.6 1.65 17.05 1.8 L17.65 2 Q18.05 2.15 17.8 2.55 L17.05 3.15'/><path d='M15.65 5.05L17.15 5.7' stroke-width='1.8'/><path d='M4.2 8 C4.2 6.35 7.2 5.05 11.95 5.05 C16.7 5.05 19.8 6.35 19.8 8 C19.8 9.7 16.7 10.95 11.95 10.95 C7.2 10.95 4.2 9.7 4.2 8'/><path d='M6.2 8.15 C7.5 7.45 9.45 7.15 11.95 7.15 C14.3 7.15 16.25 7.45 17.55 8.1' stroke-width='1.3'/><path d='M4.8 10.75L4.25 12.35'/><path d='M4.15 13.05 C3.7 16.1 5.05 18.3 7.45 19.65 C8.65 20.3 10.05 20.65 11.95 20.7'/><path d='M19.15 10.75L19.7 12.35'/><path d='M19.8 13.05 C20.25 16.1 18.9 18.3 16.5 19.65 C15.3 20.3 13.9 20.65 11.95 20.7'/><path d='M7.35 20.15C9.2 20.8 10.55 21 11.95 21C13.35 21 14.7 20.8 16.55 20.15'/><path d='M7.5 21.2 C7.45 22.15 9.35 22.7 11.95 22.7 C14.55 22.7 16.45 22.15 16.4 21.2'/></svg>">
    <script src="./fabric.min.js"></script>
    <script src="./math.min.js"></script>
    <script src="./jspdf.umd.min.js"></script>
    <script src="./tex-svg.js"></script>
    <script src="./dexie.min.js"></script>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="mathpad.css">
    
    <!-- iOS/iPadOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MathPad">
    <link rel="apple-touch-icon" href="./icono-192.png">
    <script>
      if ('serviceWorker' in navigator && ['http:', 'https:'].includes(location.protocol)) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker registrado con éxito'))
            .catch(err => console.error('Error al registrar Service Worker', err));
        });
      }
    </script>
</head>
<body>
<div id="recoverBar">
  <span>📋 Sesión guardada el <strong id="recoverDate"></strong> — ¿Recuperar?</span>
  <div style="display:flex;gap:8px;flex-shrink:0">
    <button id="btnDoRecover">
      Recuperar
    </button>
    <button id="btnDiscardRecover">
      Descartar
    </button>
  </div>
</div>

    <!-- TOP BAR - Sistema -->
    <div class="top-bar" role="toolbar" aria-label="Barra de sistema">
        <!-- Archivo -->
        <div class="tool-group">
            <button id="btnSaveProj" title="Guardar Sesión en PC">
                <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h10"/></svg>
            </button>
            <button id="btnLoadProj" title="Cargar Sesión desde PC">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
            </button>
            <button id="btnExportPDF" title="Exportar PDF">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
            </button>
            <button id="btnExport" title="Exportar PNG">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </button>
        </div>

        <!-- Historial -->
        <div class="tool-group">
            <button id="btnUndo" title="Deshacer [Ctrl+Z]">
                <svg viewBox="0 0 24 24"><path d="M3 10h10a5 5 0 015 5v2M3 10l5-5M3 10l5 5"/></svg>
            </button>
            <button id="btnRedo" title="Rehacer [Ctrl+Y]">
                <svg viewBox="0 0 24 24"><path d="M21 10H11a5 5 0 00-5 5v2M21 10l-5-5M21 10l-5 5"/></svg>
            </button>
        </div>

        <!-- Entorno -->
        <div class="tool-group">
            <select id="bgSelect" title="Tipo de fondo" aria-label="Tipo de fondo">
                <option value="bg-lined" selected>📄 Rayado</option>
                <option value="bg-grid">📊 Cuadrícula</option>
                <option value="bg-plain">⬜ Liso</option>
            </select>
            <!-- NUEVO: Selector de color de fondo -->
            <label title="Color de la hoja" style="display:flex; align-items:center; gap:4px; cursor:pointer; padding:6px; margin-left:4px;">
                <input type="color" id="bgColorPicker" value="#1a1a1a" style="width:26px; height:26px; border:1px solid var(--border-color); border-radius:6px; background:transparent; padding:0; cursor:pointer;">
            </label>
            <button id="themeToggle" class="theme-toggle" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            </button>
            <button id="btnCalcToggle" title="Mostrar/Ocultar Calculadora" aria-label="Toggle calculadora">
                <svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/></svg>
            </button>
            <button id="btnClear" class="btn-danger" title="Limpiar todo">
                <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
            </button>
        </div>

        <!-- Marca -->
        <div class="brand-logo" title="MathPad by TomamatesxD">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.55"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <!-- SIGNO DE INTEGRAL (BOLITAS ALINEADAS VERTICALMENTE CON LAS PUNTAS) -->
              <g transform="translate(4.9, 11.5) scale(0.58, 0.35)">
                <path d="M12 8 C 12 5.5 14 4 16 4" />
                <path d="M12 8 V 16" />
                <path d="M12 16 C 12 18.5 10 20 8 20" />
                <!-- Bolita superior alineada con la punta en el borde -->
                <circle cx="15.8" cy="4.6" r="1.3" fill="currentColor" stroke="none" />
                <!-- Bolita inferior alineada con la punta en el borde -->
                <circle cx="8.2" cy="19.4" r="1.3" fill="currentColor" stroke="none" />
              </g>

              <!-- BOMBILLA -->
              <path d="M13.25 8.55L16.05 2.85" />
              <path d="M14.15 8.85L17.05 3.15" />
              <path d="M16.05 2.85 L16.35 2.15 Q16.6 1.65 17.05 1.8 L17.65 2 Q18.05 2.15 17.8 2.55 L17.05 3.15" />
              <path d="M15.65 5.05L17.15 5.7" stroke-width="1.8" />

              <!-- BORDE DEL MATE -->
              <path d="M4.2 8 C4.2 6.35 7.2 5.05 11.95 5.05 C16.7 5.05 19.8 6.35 19.8 8 C19.8 9.7 16.7 10.95 11.95 10.95 C7.2 10.95 4.2 9.7 4.2 8" />
              <path d="M6.2 8.15 C7.5 7.45 9.45 7.15 11.95 7.15 C14.3 7.15 16.25 7.45 17.55 8.1" stroke-width="1.3" />

              <!-- CUERPO -->
              <path d="M4.8 10.75L4.25 12.35" />
              <path d="M4.15 13.05 C3.7 16.1 5.05 18.3 7.45 19.65 C8.65 20.3 10.05 20.65 11.95 20.7" />
              <path d="M19.15 10.75L19.7 12.35" />
              <path d="M19.8 13.05 C20.25 16.1 18.9 18.3 16.5 19.65 C15.3 20.3 13.9 20.65 11.95 20.7" />

              <!-- BASE -->
              <path d="M7.35 20.15C9.2 20.8 10.55 21 11.95 21C13.35 21 14.7 20.8 16.55 20.15" />
              <path d="M7.5 21.2 C7.45 22.15 9.35 22.7 11.95 22.7 C14.55 22.7 16.45 22.15 16.4 21.2" />
            </svg>
            <div class="brand-text">
                <span class="brand-title">MathPad</span>
                <span class="brand-author">by TomamatesxD</span>
            </div>
        </div>
    </div>

    <!-- LEFT SIDEBAR - Herramientas de dibujo -->
    <div class="left-sidebar" role="toolbar" aria-label="Herramientas de dibujo">
        <button id="btnSelect" class="active" title="Seleccionar [V]">
            <svg viewBox="0 0 24 24"><path d="M4 4l7 18 2.5-7.5L21 12z"/></svg>
        </button>
        <button id="btnPan" title="Mover lienzo [H]">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 11V6a2 2 0 0 0-4 0v4"/><path d="M14 11V4a2 2 0 0 0-4 0v6"/><path d="M10 11V5a2 2 0 0 0-4 0v9l-3-3a2 2 0 0 0-3 3l5 7h9a5 5 0 0 0 5-5v-6Z"/>
            </svg>
        </button>
        <button id="btnPen" title="Lápiz [P]">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
        </button>
        <button id="btnHighlight" title="Resaltador">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11.5 6.5 14C5.5 15 5 16 5 17.5 5 19 6.5 20 8 20c1.5 0 2.5-.5 3.5-1.5L14 16"/><path d="m14 7-3 3"/><path d="M17 3l4 4L11 17l-4-4z"/></svg>
        </button>
        <button id="btnFill" title="Relleno de Color [F]">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 11l-8-8-8 8h16z"/><path d="M3 11v8a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-8H3z"/><path d="M12 11v10"/></svg>
        </button>
        <button id="btnText" title="Texto [T]">
            <svg viewBox="0 0 24 24"><path d="M4 4h6v10H4zM14 4h6v10h-6zM4 18h16v2H4z"/></svg>
        </button>
        
        <div class="tool-separator"></div>
        
        <button id="btnEraserStroke" title="Borrador [E]">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
        </button>
        <button id="btnRuler" title="Regla/Compás [R]">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="8" x2="6" y2="12"/><line x1="10" y1="8" x2="10" y2="12"/><line x1="14" y1="8" x2="14" y2="12"/><line x1="18" y1="8" x2="18" y2="12"/></svg>
        </button>
        <button id="btnToggleAxes" title="Mostrar/Ocultar Ejes [A]">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 22 4 4 22 4"/><path d="M8 4v4"/><path d="M12 4v4"/><path d="M16 4v4"/><path d="M4 8h4"/><path d="M4 12h4"/><path d="M4 16h4"/></svg>
        </button>
        
        <div class="tool-separator"></div>
        
        <!-- Formas e Inserción (acceso directo) -->
        <button id="menuBtnLine" title="Línea">
            <svg viewBox="0 0 24 24"><path d="M4 20L20 4"/></svg>
        </button>
        <button id="menuBtnRect" title="Rectángulo">
            <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/></svg>
        </button>
        <button id="menuBtnCircle" title="Círculo">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
        </button>
        <button id="menuBtnTriangle" title="Triángulo">
            <svg viewBox="0 0 24 24"><path d="M12 4L20 20H4z"/></svg>
        </button>
        
        <div class="tool-separator"></div>
        
        <button id="menuBtnLatex" title="Fórmula LaTeX">
            <svg viewBox="0 0 24 24"><path d="M4 8h4v8H4zM10 8h4v8h-4zM16 8h4v8h-4z"/></svg>
        </button>
        <button id="menuBtnImage" title="Insertar imagen">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        </button>
        <button id="menuBtnPlot" title="Graficar función">
            <svg viewBox="0 0 24 24"><path d="M3 20L21 4M3 20h18M3 20v-18"/></svg>
        </button>
    </div>

    <!-- CONTEXT-MENU PANEL - Controles contextuales (color, grosor, fuente) -->
    <div id="contextMenu" class="context-menu hidden">
        <div class="context-menu-group">
            <label title="Color del trazo">🎨 <input type="color" id="colorPicker" value="#000000"></label>
        </div>
        <div class="context-menu-group">
            <label title="Grosor del trazo">📏 <input type="range" id="widthPicker" min="1" max="50" value="3"></label>
            <span id="widthValue">3</span>
        </div>
        <div class="context-menu-group">
            <label title="Tamaño de fuente">🔤 <input type="number" id="fontSizePicker" min="8" max="120" value="16"></label>
        </div>
    </div>

    <!-- BOTTOM BAR - Navegación de páginas -->
    <div class="bottom-bar" role="navigation" aria-label="Navegación de páginas">
        <button id="btnPrevPage" title="Página anterior">
            <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span id="pageIndicator" title="Página actual">1 / 1</span>
        <button id="btnNextPage" title="Página siguiente">
            <svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button id="btnAddPage" title="Nueva página">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="12" y1="18" x2="12" y2="12"/>
                <line x1="9" y1="15" x2="15" y2="15"/>
            </svg>
        </button>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <!-- CANVAS -->
        <div class="canvas-wrapper bg-lined" id="canvasWrapper">
            <canvas id="mainCanvas"></canvas>
        </div>

        <!-- CALCULADORA (oculta por defecto) -->
        <div class="calculator-panel hidden" id="calcPanel">
            <div class="calc-display">
                <div class="calc-expr"   id="calcExpr" draggable="true"></div>
                <div class="calc-result" id="calcResult" draggable="true">0</div>
            </div>
        <div class="calc-controls">
            <label>
                <input type="checkbox" id="toggleSci"> Científica
            </label>
            <button id="calcMemory" class="calc-memory-btn" title="Memoria (M+/M-/MR/MC)">M</button>
        </div>
        <div class="calc-keys" id="calcKeys">
            <!-- Científicas -->
            <button class="sci-btn operator" data-val="sin(">sin</button>
            <button class="sci-btn operator" data-val="cos(">cos</button>
            <button class="sci-btn operator" data-val="tan(">tan</button>
            <button class="sci-btn operator" data-val="sqrt(">√x</button>
            <button class="sci-btn operator" data-val="^">xʸ</button>
            <button class="sci-btn operator" data-val="log(">log</button>
            <button class="sci-btn operator" data-val="(">(</button>
            <button class="sci-btn operator" data-val=")">)</button>
            <button class="sci-btn operator" data-val="pi">π</button>
            <button class="sci-btn operator" data-val="e">e</button>

            <!-- Básicas -->
            <button class="action" id="calcClear">C</button>
            <button class="action" id="calcDel">⌫</button>
            <button class="operator" data-val="%">%</button>
            <button class="operator" data-val="/">÷</button>

            <button data-val="7">7</button>
            <button data-val="8">8</button>
            <button data-val="9">9</button>
            <button class="operator" data-val="*">×</button>

            <button data-val="4">4</button>
            <button data-val="5">5</button>
            <button data-val="6">6</button>
            <button class="operator" data-val="-">−</button>

            <button data-val="1">1</button>
            <button data-val="2">2</button>
            <button data-val="3">3</button>
            <button class="operator" data-val="+">+</button>

            <button data-val="0" style="grid-column: span 2;">0</button>
            <button data-val=".">.</button>
            <button class="equals" id="calcEquals">=</button>
        </div>
        <!-- Historial de operaciones -->
        <div class="calc-history" id="calcHistory">
            <div class="calc-history-header">Historial</div>
            <div class="calc-history-list" id="calcHistoryList"></div>
        </div>
        </div>
    </div>

    <!-- Function Plotter Modal -->
    <div id="plotModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.65);
      z-index:9000; align-items:center; justify-content:center;">
      <div style="background:#1e1e1e; border:1px solid #444; border-radius:14px;
        padding:28px 32px; width:90%; max-width:500px;">
        <h3 style="color:#bb86fc; margin-bottom:20px; font-size:16px">📈 Graficar función</h3>

        <label style="color:#aaa; font-size:12px; display:block; margin-bottom:6px">
          f(x) = <small style="color:#666">(usá: sin, cos, tan, sqrt, abs, log, pi, e, ^)</small>
        </label>
        <input id="plotExpr" type="text" value="x^2"
          style="width:100%; background:#121212; border:1px solid #555; border-radius:8px;
            padding:10px 12px; color:#e0e0e0; font-family:monospace; font-size:15px;
            margin-bottom:14px; outline:none;">

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px">
          <div>
            <label style="color:#aaa; font-size:12px; display:block; margin-bottom:4px">x mínimo</label>
            <input id="plotXMin" type="number" value="-5"
              style="width:100%; background:#121212; border:1px solid #555; border-radius:8px;
                padding:9px 12px; color:#e0e0e0; font-size:14px; outline:none;">
          </div>
          <div>
            <label style="color:#aaa; font-size:12px; display:block; margin-bottom:4px">x máximo</label>
            <input id="plotXMax" type="number" value="5"
              style="width:100%; background:#121212; border:1px solid #555; border-radius:8px;
                padding:9px 12px; color:#e0e0e0; font-size:14px; outline:none;">
          </div>
        </div>

        <div style="display:flex; gap:14px; margin-bottom:14px; align-items:center;">
          <div>
            <label style="color:#aaa; font-size:12px; display:block; margin-bottom:4px">Color</label>
            <input id="plotColorPicker" type="color" value="#bb86fc"
              style="width:40px; height:32px; background:transparent; border:1px solid #555; border-radius:6px; cursor:pointer;">
          </div>
          <div style="padding-top: 16px;">
            <label style="color:#e0e0e0; font-size:13px; display:flex; align-items:center; gap:6px; cursor:pointer;">
              <input id="plotOnlyLine" type="checkbox" style="width:16px; height:16px; accent-color:#bb86fc;">
              Fondo transparente (Solo línea)
            </label>
          </div>
        </div>

        <div style="margin-bottom:14px">
          <label style="color:#aaa; font-size:12px; display:block; margin-bottom:6px">Funciones graficadas:</label>
          <div id="plotFunctionsList" style="background:#121212; border:1px solid #555; border-radius:8px;
            padding:8px; min-height:40px; max-height:120px; overflow-y:auto; font-size:13px; color:#888;">
            <span style="font-style:italic">Ninguna función graficada aún</span>
          </div>
        </div>

        <div style="display:flex; gap:10px">
          <button id="plotBtnAdd"
            style="flex:1; background:#bb86fc; color:#000; border:none; border-radius:8px;
              padding:11px; font-weight:700; cursor:pointer; font-size:14px">
            + Agregar
          </button>
          <button id="plotBtnClear"
            style="background:transparent; color:#cf6679; border:1px solid #cf6679;
              border-radius:8px; padding:11px 14px; cursor:pointer; font-size:13px">
            Limpiar
          </button>
          <button id="plotBtnClose"
            style="background:transparent; color:#999; border:1px solid #444;
              border-radius:8px; padding:11px 18px; cursor:pointer; font-size:14px">
            Cerrar
          </button>
        </div>
        <p id="plotError" style="color:#f87171; font-size:12px; margin-top:10px; display:none"></p>
      </div>
    </div>

    <!-- Inputs ocultos -->
    <input type="file" id="fileInput" accept=".json" style="display: none;">
    <input type="file" id="imgFileInput" accept="image/*" style="display: none;">
    
    <!-- Botones ocultos para funciones -->
    <button id="btnLatex" style="display: none;"></button>
    <button id="btnInsertImage" style="display: none;"></button>
    <button id="btnPlot" style="display: none;"></button>

    <script src="mathpad.js"></script>
</body>
</html>
