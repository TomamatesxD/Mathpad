name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  validate-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate HTML
        run: |
          npm init -y
          npm install --no-save html-validate@11
          npx html-validate index.html
      - name: Check UTF-8 encoding
        run: |
          python - <<'PY'
          import pathlib, sys
          files = ['index.html', 'sw.js', 'README.md', '.github/workflows/ci.yml']
          errors = []
          for name in files:
              data = pathlib.Path(name).read_bytes()
              if data.startswith(b'\xef\xbb\xbf'):
                  errors.append(f'{name}: BOM detected')
                  continue
              try:
                  data.decode('utf-8')
              except UnicodeDecodeError as e:
                  errors.append(f'{name}: {e}')
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('UTF-8 OK: ' + ', '.join(files))
          PY
