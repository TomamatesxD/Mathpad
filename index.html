<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MathPad - Entorno de Estudio Matemático</title>

    <!-- Librerías externas vía CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/12.4.1/math.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dexie@3.2.6/dist/dexie.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <style>
/* ═══════════════════════════════════════════════════════════════
   MATH PAD — ESTILOS COMPLETOS
   Fuente: mathpad.css (consolidado)
╔═══════════════════════════════════════════════════════════════ */
:root {
    --bg-dark: #121212;
    --bg-panel: #1e1e1e;
    --border-color: #333333;
    --text-main: #e0e0e0;
    --accent: #bb86fc;
    --accent-hover: #9965f4;
    --danger: #cf6679;
    --toolbar-h: 56px;
    --sidebar-w: 60px;
    --bottom-bar-h: 48px;
    --calc-w: 320px;
    --paper-bg: #1a1a1a;
    --line-color: rgba(255,255,255,0.08);
    --grid-color: rgba(255,255,255,0.05);
}

*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    -webkit-user-select: none;
    user-select: none;
}

body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ── BARRA DE RECUPERACIÓN DE SESIÓN ──────────────── */
#recoverBar {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: #2a2400;
    border-bottom: 1px solid #7c5c00;
    color: #fde68a;
    padding: 10px 16px;
    z-index: 99999;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    font-size: 14px;
    box-sizing: border-box;
}
#recoverBar > div { display: flex; gap: 8px; flex-shrink: 0; }
#btnDoRecover { background: #bb86fc; color: #000; border: none; border-radius: 6px; padding: 6px 16px; font-weight: 600; cursor: pointer; font-size: 13px; }
#btnDiscardRecover { background: transparent; color: #fde68a; border: 1px solid #7c5c00; border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px; }

:root.light-mode #recoverBar { background: #fef3c7; border-bottom-color: #f59e0b; color: #92400e; }
:root.light-mode #btnDoRecover { background: #7c3aed; color: #fff; }
:root.light-mode #btnDiscardRecover { color: #92400e; border-color: #f59e0b; }

/* ═══════════════════════════════════════════════════════════════
    TOP BAR
╔═══════════════════════════════════════════════════════════════ */
.top-bar {
    position: relative;
    width: 100%;
    height: var(--toolbar-h);
    background-color: var(--bg-panel);
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 8px 16px;
    gap: 12px;
    z-index: 100;
    flex-shrink: 0;
    box-sizing: border-box;
    pointer-events: auto;
    padding-top: env(safe-area-inset-top, 0px);
}

.tool-group {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 12px;
    border-right: 1px solid var(--border-color);
}

.top-bar .tool-group:last-child { border-right: none; }

.tool-separator {
    width: 1px;
    height: 24px;
    background: var(--border-color);
    margin: 0 8px;
    flex-shrink: 0;
    opacity: 0.6;
}

.top-bar button,
.top-bar select {
    background: transparent;
    color: var(--text-main);
    border: 1px solid transparent;
    padding: 6px 11px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    min-width: 44px;
    min-height: 44px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

.top-bar button:hover { background: rgba(255,255,255,0.1); }

.top-bar button.active {
    background: rgba(187,134,252,0.18);
    border-color: var(--accent);
    color: var(--accent);
}

.top-bar button.btn-danger:hover { background: var(--danger); color: #fff; }

.top-bar select {
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    padding: 6px 10px;
}

.top-bar select:hover { border-color: var(--accent); }

/* ═══════════════════════════════════════════════════════════════
   LEFT SIDEBAR
╔═══════════════════════════════════════════════════════════════ */
.left-sidebar {
    position: fixed;
    top: var(--toolbar-h);
    left: 0;
    bottom: var(--bottom-bar-h);
    width: var(--sidebar-w);
    background-color: var(--bg-panel);
    border-right: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 8px 0;
    padding-left: env(safe-area-inset-left, 0px);
    gap: 4px;
    z-index: 90;
    overflow-y: auto;
    overflow-x: hidden;
}

.left-sidebar .tool-separator {
    width: 32px;
    height: 1px;
    margin: 4px 0;
}

.left-sidebar button {
    background: transparent;
    color: var(--text-main);
    border: 1px solid transparent;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

.left-sidebar button:hover { background: rgba(255,255,255,0.1); }

.left-sidebar button.active {
    background: rgba(187,134,252,0.18);
    border-color: var(--accent);
    color: var(--accent);
}

/* ═══════════════════════════════════════════════════════════════
   BOTTOM BAR
╔═══════════════════════════════════════════════════════════════ */
.bottom-bar {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    height: var(--bottom-bar-h);
    background-color: var(--bg-panel);
    border: 1px solid var(--border-color);
    border-radius: 24px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    padding-bottom: env(safe-area-inset-bottom, 0px);
    gap: 12px;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

.bottom-bar button {
    background: transparent;
    color: var(--text-main);
    border: 1px solid transparent;
    padding: 6px 12px;
    border-radius: 16px;
    cursor: pointer;
    font-size: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    min-width: 36px;
    height: 32px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

.bottom-bar button:hover { background: rgba(255,255,255,0.1); }

.bottom-bar button.active {
    background: rgba(187,134,252,0.18);
    border-color: var(--accent);
    color: var(--accent);
}

#pageIndicator {
    color: var(--text-main);
    font-size: 13px;
    font-weight: 600;
    padding: 0 8px;
    min-width: 50px;
    text-align: center;
}

/* ═══════════════════════════════════════════════════════════════
   MAIN CONTENT
╔═══════════════════════════════════════════════════════════════ */
.main-content {
    display: flex;
    flex: 1;
    overflow: hidden;
    min-height: 0;
    margin-left: var(--sidebar-w);
    margin-bottom: var(--bottom-bar-h);
}

/* ═══════════════════════════════════════════════════════════════
   CANVAS
╔═══════════════════════════════════════════════════════════════ */
.canvas-wrapper {
    flex: 1;
    position: relative;
    background-color: var(--paper-bg);
    overflow: hidden;
    min-width: 0;
}

.bg-lined {
    background-image: linear-gradient(var(--line-color) 1px, transparent 1px);
}
.bg-grid {
    background-image:
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
}
.bg-plain { background-image: none; }

.canvas-container { position: absolute !important; top: 0; left: 0; }

/* ═══════════════════════════════════════════════════════════════
   CALCULADORA
╔═══════════════════════════════════════════════════════════════ */
.calculator-panel {
    width: var(--calc-w);
    background-color: var(--bg-panel);
    border-left: 1px solid var(--border-color);
    display: flex;
    flex-direction: column;
    z-index: 10;
    flex-shrink: 0;
    overflow: hidden;
    transition: width 0.25s ease, opacity 0.25s ease;
}

.calculator-panel.hidden {
    width: 0;
    opacity: 0;
    pointer-events: none;
    border-left-width: 0;
}

.calc-display {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border-color);
    background-color: rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
}

.calc-expr {
    font-size: 13px;
    color: #888;
    min-height: 18px;
    text-align: right;
    word-break: break-all;
    width: 100%;
}

.calc-result {
    font-size: 30px;
    font-weight: 700;
    min-height: 38px;
    text-align: right;
    word-break: break-all;
    width: 100%;
}

.calc-controls {
    padding: 8px 14px;
    display: flex;
    justify-content: flex-end;
    border-bottom: 1px solid var(--border-color);
}

.calc-controls label {
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
}

.calc-keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    padding: 12px;
    flex: 1;
    align-content: start;
}

.calc-keys button {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    font-size: 17px;
    height: 48px;
    border-radius: 5px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background 0.1s;
    -webkit-user-select: none;
    user-select: none;
}

.calc-keys button:hover  { background: rgba(255,255,255,0.12); }
.calc-keys button:active { background: rgba(255,255,255,0.2); }

.calc-keys button.operator { color: var(--accent); }

.calc-keys button.action {
    background: rgba(207,102,121,0.15);
    color: var(--danger);
}
.calc-keys button.action:hover { background: rgba(207,102,121,0.3); }

.calc-keys button.equals {
    background: var(--accent);
    color: var(--bg-dark);
    font-weight: 700;
    border-color: var(--accent);
}
.calc-keys button.equals:hover { background: var(--accent-hover); }

/* Científicas */
.sci-btn { display: none !important; }
.sci-mode .sci-btn { display: flex !important; }
.sci-mode .calc-keys { grid-template-columns: repeat(5, 1fr); }

/* Botón de memoria */
.calc-memory-btn {
    background: rgba(187,134,252,0.15);
    color: var(--accent);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    margin-left: auto;
}
.calc-memory-btn:hover { background: rgba(187,134,252,0.25); }

/* Historial de operaciones */
.calc-history {
    border-top: 1px solid var(--border-color);
    padding: 8px;
    max-height: 150px;
    overflow-y: auto;
}
.calc-history-header {
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
    font-weight: 600;
}
.calc-history-list { font-size: 12px; color: #aaa; }
.calc-history-item {
    padding: 3px 0;
    border-bottom: 1px solid #2a2a2a;
    cursor: pointer;
}
.calc-history-item:hover { color: var(--accent); }
.calc-history-item .history-expr { color: #666; font-size: 11px; }
.calc-history-item .history-result { color: #e0e0e0; font-weight: 500; }

/* ═══════════════════════════════════════════════════════════════
   CURSORES
╔═══════════════════════════════════════════════════════════════ */
.cursor-pen    { cursor: crosshair !important; }
.cursor-text   { cursor: text !important; }
.cursor-eraser { cursor: cell !important; }
.cursor-pan    { cursor: grab !important; }
.cursor-panning { cursor: grabbing !important; }
.cursor-cross  { cursor: crosshair !important; }

/* ═══════════════════════════════════════════════════════════════
   RESPONSIVE
╔═══════════════════════════════════════════════════════════════ */
@media (max-width: 768px) {
    .top-bar {
        justify-content: flex-start;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        padding: 6px 12px;
        gap: 8px;
    }
    .top-bar::-webkit-scrollbar { display: none; }
    .left-sidebar { width: 52px; padding: 8px 0; }
    .left-sidebar button { width: 40px; height: 40px; font-size: 18px; }
    .main-content { flex-direction: column; }
    .calculator-panel {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        width: 100% !important;
        height: 60vh;
        border-left: none;
        border-top: 1px solid var(--border-color);
        border-radius: 16px 16px 0 0;
        box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
        z-index: 1000;
        transform: translateY(100%);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
    }
    .calculator-panel:not(.hidden) { transform: translateY(0); }
    .calculator-panel.hidden {
        width: 100% !important;
        opacity: 0;
        pointer-events: none;
        transform: translateY(100%);
    }
}

/* ═══════════════════════════════════════════════════════════════
   TRANSICIONES GLOBALES
╔═══════════════════════════════════════════════════════════════ */
.top-bar button,
.top-bar select,
.left-sidebar button,
.bottom-bar button,
.calc-keys button,
.calc-memory-btn {
    transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
}
.calculator-panel {
    transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1),
                opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ═══════════════════════════════════════════════════════════════
   MODO CLARO
╔═══════════════════════════════════════════════════════════════ */
:root.light-mode {
    --bg-dark: #f5f5f5;
    --bg-panel: #ffffff;
    --border-color: #e0e0e0;
    --text-main: #212121;
    --accent: #7c3aed;
    --accent-hover: #6d28d9;
    --danger: #dc2626;
    --paper-bg: #ffffff;
    --line-color: rgba(0,0,0,0.08);
    --grid-color: rgba(0,0,0,0.05);
}

:root.light-mode body { background-color: var(--bg-dark); color: var(--text-main); }

:root.light-mode .top-bar,
:root.light-mode .left-sidebar,
:root.light-mode .bottom-bar {
    background-color: var(--bg-panel);
    border-color: var(--border-color);
}

:root.light-mode .top-bar button,
:root.light-mode .left-sidebar button,
:root.light-mode .bottom-bar button { color: var(--text-main); }

:root.light-mode .top-bar button:hover,
:root.light-mode .left-sidebar button:hover,
:root.light-mode .bottom-bar button:hover { background: rgba(0,0,0,0.08); }

:root.light-mode .top-bar button.active,
:root.light-mode .left-sidebar button.active,
:root.light-mode .bottom-bar button.active {
    background: rgba(124,58,237,0.12);
    border-color: var(--accent);
    color: var(--accent);
}

:root.light-mode .canvas-wrapper { background-color: var(--paper-bg); }

:root.light-mode .calculator-panel {
    background-color: var(--bg-panel);
    border-left-color: var(--border-color);
}

:root.light-mode .calc-display {
    background-color: rgba(0,0,0,0.03);
    border-bottom-color: var(--border-color);
}

:root.light-mode .calc-controls { border-bottom-color: var(--border-color); }

:root.light-mode .calc-keys button {
    background: rgba(0,0,0,0.04);
    border-color: var(--border-color);
    color: var(--text-main);
}

:root.light-mode .calc-keys button:hover { background: rgba(0,0,0,0.08); }
:root.light-mode .calc-keys button:active { background: rgba(0,0,0,0.12); }

:root.light-mode .calc-history { border-top-color: var(--border-color); }
:root.light-mode .calc-history-item { border-bottom-color: #e0e0e0; }

:root.light-mode #plotModal > div { background: #ffffff; border-color: var(--border-color); }
:root.light-mode #plotModal label { color: #666; }
:root.light-mode #plotModal input { background: #f5f5f5; border-color: var(--border-color); color: var(--text-main); }

/* Theme toggle */
.theme-toggle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
}

.theme-toggle:hover {
    background: rgba(187,134,252,0.15);
    border-color: var(--accent);
}

:root.light-mode .theme-toggle {
    background: var(--bg-panel);
    border-color: var(--border-color);
}

/* ═══════════════════════════════════════════════════════════════
   CONTEXT MENU
╔═══════════════════════════════════════════════════════════════ */
.context-menu {
    position: fixed;
    top: calc(var(--toolbar-h) + 8px);
    left: calc(var(--sidebar-w) + 8px);
    background: rgba(30, 30, 30, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    z-index: 95;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    transition: opacity 0.2s ease, transform 0.2s ease;
}

.context-menu-group {
    display: flex;
    align-items: center;
    gap: 6px;
}

.context-menu-group label {
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--text-main);
    font-size: 13px;
    cursor: pointer;
}

/* SVG ICON STYLING */
.left-sidebar button svg,
.top-bar button svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 0.15s ease;
}

.top-bar button svg { width: 18px; height: 18px; }

.context-menu input[type="color"] {
    width: 28px;
    height: 28px;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    padding: 0;
}

.context-menu-group input[type="range"] { width: 80px; accent-color: var(--accent); }

.context-menu-group input[type="number"] {
    width: 50px;
    background: var(--bg-panel);
    border: 1px solid var(--border-color);
    border-radius: 6px;
    color: var(--text-main);
    padding: 4px 6px;
    font-size: 13px;
    text-align: center;
}

#widthValue { color: var(--text-main); font-size: 12px; min-width: 16px; text-align: center; }
.context-menu.hidden { display: none !important; }
    </style>
</head>
<body>
<div id="recoverBar">
  <span>📋 Sesión guardada el <strong id="recoverDate"></strong> — ¿Recuperar?</span>
  <div>
    <button type="button" id="btnDoRecover" aria-label="Acción">Recuperar</button>
    <button type="button" id="btnDiscardRecover" aria-label="Acción">Descartar</button>
  </div>
</div>

    <!-- TOP BAR -->
    <div class="top-bar" role="toolbar" aria-label="Barra de sistema">
        <div class="tool-group">
            <button type="button" id="btnSaveProj" title="Guardar Sesión en PC" aria-label="Acción">
                <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><path d="M17 21v-8H7v8M7 3v5h10"/></svg>
            </button>
            <button type="button" id="btnLoadProj" title="Cargar Sesión desde PC" aria-label="Acción">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
            </button>
            <button type="button" id="btnExportPDF" title="Exportar PDF" aria-label="Acción">
                <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
            </button>
            <button type="button" id="btnExport" title="Exportar PNG" aria-label="Acción">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>

    <script>
/* ═══════════════════════════════════════════════════════════════
   MATH PAD — LÓGICA COMPLETA
   Fuente: mathpad.js (consolidado)
╔═══════════════════════════════════════════════════════════════ */
window.addEventListener('load', function() {
    if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist();
    }

    const canvasWrapper = document.getElementById('canvasWrapper');
    const calcPanel     = document.getElementById('calcPanel');

    const canvas = new fabric.Canvas('mainCanvas', {
        isDrawingMode: false,
        selection: false,
        preserveObjectStacking: true,
        renderOnAddRemove: true,
        skipTargetFind: false
    });

    fabric.Object.prototype.perPixelTargetFind = true;
    canvas.targetFindTolerance = 8;

    const standardBrush = new fabric.PencilBrush(canvas);
    standardBrush.color = document.getElementById('colorPicker').value;
    standardBrush.width = parseInt(document.getElementById('widthPicker').value, 10);
    canvas.freeDrawingBrush = standardBrush;

    let currentTool     = 'pen';
    let isPanning       = false;
    let isPointerDown   = false;
    let isErasing       = false;
    let isSpaceDown     = false;
    let lastPosX = 0, lastPosY = 0;
    let clipboard = null;
    let isHistoryAction = false, historyStack = [], redoStack = [];
    let calcVisible = false;
    let showAxes = false;
    let activeShape = null, startX = 0, startY = 0;
    let objectEraseMap = new Map();
    let affectedObjects = new Set();
    let rulerStartPoint = null;
    let rulerCurrentLine = null;
    let rulerSnapAngle = 15;
    let rulerSnapLength = 50;
    let pages = [null];
    let currentPage = 0;

    function hexToRgba(hex, alpha) {
        var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
    }

    function resizeCanvas() {
        canvas.setWidth(canvasWrapper.clientWidth);
        canvas.setHeight(canvasWrapper.clientHeight);
        syncBackground();
        canvas.requestRenderAll();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function syncBackground() {
        const vpt = canvas.viewportTransform, scale = vpt[0], x = vpt[4], y = vpt[5], base = 30;
        canvasWrapper.style.backgroundPosition = x + 'px ' + y + 'px';
        const bg = document.getElementById('bgSelect').value;
        if (bg === 'bg-lined') canvasWrapper.style.backgroundSize = '100% ' + (base * scale) + 'px';
        else if (bg === 'bg-grid') canvasWrapper.style.backgroundSize = (base * scale) + 'px ' + (base * scale) + 'px';
    }

    canvas.on('mouse:wheel', function(opt) {
        var e = opt.e; e.preventDefault(); e.stopPropagation();
        var zoom = Math.min(Math.max(canvas.getZoom() * Math.pow(0.999, e.deltaY), 0.2), 5);
        canvas.zoomToPoint({ x: e.offsetX, y: e.offsetY }, zoom);
        syncBackground();
    });

    let lastTouchDistance = 0;
    let lastTouchCenter = null;
    let isTouchPanning = false;

    canvas.on('touch:gesture', function(opt) {
        if (opt.e.touches && opt.e.touches.length === 2) {
            var touch1 = opt.e.touches[0];
            var touch2 = opt.e.touches[1];
            var dx = touch2.clientX - touch1.clientX;
            var dy = touch2.clientY - touch1.clientY;
            var distance = Math.sqrt(dx * dx + dy * dy);
            var centerX = (touch1.clientX + touch2.clientX) / 2;
            var centerY = (touch1.clientY + touch2.clientY) / 2;
            if (lastTouchDistance > 0) {
                var scale = distance / lastTouchDistance;
                var newZoom = Math.min(Math.max(canvas.getZoom() * scale, 0.2), 5);
                if (lastTouchCenter) {
                    var vpt = canvas.viewportTransform;
                    vpt[4] += centerX - lastTouchCenter.x;
                    vpt[5] += centerY - lastTouchCenter.y;
                }
                canvas.zoomToPoint({ x: centerX, y: centerY }, newZoom);
                syncBackground();
            }
            lastTouchDistance = distance;
            lastTouchCenter = { x: centerX, y: centerY };
            opt.e.preventDefault();
        }
    });

    canvas.on('touch:end', function() {
        lastTouchDistance = 0;
        lastTouchCenter = null;
        isTouchPanning = false;
    });

    canvas.on('mouse:down', function(opt) {
        if (currentTool === 'select') return;
        var evt = opt.e;
        var isPrimaryAction = evt.button === 0 || evt.pointerType === 'touch' || evt.pointerType === 'pen';
        if (evt.button === 1 || currentTool === 'pan' || (isSpaceDown && currentTool !== 'eraser-normal')) {
            isPanning = true;
            var clientX = evt.touches && evt.touches.length > 0 ? evt.touches[0].clientX : evt.clientX;
            var clientY = evt.touches && evt.touches.length > 0 ? evt.touches[0].clientY : evt.clientY;
            lastPosX = clientX || 0;
            lastPosY = clientY || 0;
            canvas.selection = false; canvasWrapper.classList.add('cursor-panning');
            if (evt.preventDefault) evt.preventDefault();
            return;
        }
        isPointerDown = true;
        if (currentTool === 'eraser-stroke') { evt.preventDefault(); return; }
        if (currentTool === 'eraser-normal') {
            evt.preventDefault();
            isPointerDown = true;
            objectEraseMap.forEach((pointsArray, obj) => {
                obj._originalErasePoints = JSON.parse(JSON.stringify(pointsArray));
            });
            affectedObjects.clear();
            return;
        }
        if (['line', 'rect', 'circle', 'triangle'].includes(currentTool)) {
            var pointer = canvas.getPointer(evt);
            startX = pointer.x; startY = pointer.y;
            var color = document.getElementById('colorPicker').value;
            var sw = parseInt(document.getElementById('widthPicker').value, 10);
            if (currentTool === 'line') activeShape = new fabric.Line([startX, startY, startX, startY], { stroke: color, strokeWidth: sw, selectable: false, evented: false });
            else if (currentTool === 'rect') activeShape = new fabric.Rect({ left: startX, top: startY, width: 0, height: 0, fill: 'transparent', stroke: color, strokeWidth: sw, selectable: false, evented: false });
            else if (currentTool === 'circle') activeShape = new fabric.Ellipse({ left: startX, top: startY, rx: 0, ry: 0, fill: 'transparent', stroke: color, strokeWidth: sw, selectable: false, evented: false });
            else if (currentTool === 'triangle') activeShape = new fabric.Triangle({ left: startX, top: startY, width: 0, height: 0, fill: 'transparent', stroke: color, strokeWidth: sw, selectable: false, evented: false });
            canvas.add(activeShape); return;
        }
        if (currentTool === 'text') {
            var active = canvas.getActiveObject();
            if (active && active.type === 'i-text' && active.isEditing) return;
            var pointer = canvas.getPointer(evt);
            var itext = new fabric.IText('', {
                left: pointer.x, top: pointer.y,
                fontSize: parseInt(document.getElementById('fontSizePicker').value, 10), fill: document.getElementById('colorPicker').value,
                fontFamily: 'Segoe UI', selectable: true, evented: true, editable: true, padding: 4
            });
            canvas.add(itext); canvas.setActiveObject(itext);
            itext.enterEditing(); itext.selectAll(); canvas.requestRenderAll();
        }
        if (currentTool === 'ruler') {
            var pointer = canvas.getPointer(evt);
            rulerStartPoint = { x: pointer.x, y: pointer.y };
            var color = document.getElementById('colorPicker').value;
            rulerCurrentLine = new fabric.Line([pointer.x, pointer.y, pointer.x, pointer.y], {
                stroke: color, strokeWidth: 2, selectable: false, evented: false, strokeDashArray: [5, 5]
            });
            canvas.add(rulerCurrentLine);
        }
    });

    function distToSegment(p, a, b) {
        const abx = b.x - a.x, aby = b.y - a.y;
        const lenSq = abx * abx + aby * aby;
        if (lenSq === 0) return Math.hypot(p.x - a.x, p.y - a.y);
        const t = Math.max(0, Math.min(1, ((p.x - a.x) * abx + (p.y - a.y) * aby) / lenSq));
        const nx = a.x + t * abx, ny = a.y + t * aby;
        return Math.hypot(p.x - nx, p.y - ny);
    }

    function getShapeSegmentsInCanvasSpace(obj) {
        const matrix = obj.calcTransformMatrix();
        const toCanvas = (x, y) => fabric.util.transformPoint(new fabric.Point(x, y), matrix);
        const segments = [];
        if (obj.type === 'line') {
            const pts = obj.calcLinePoints();
            const a = toCanvas(pts.x1, pts.y1), b = toCanvas(pts.x2, pts.y2);
            segments.push({ a, b });
        } else if (['rect', 'triangle', 'image', 'i-text', 'text'].includes(obj.type)) {
            const coords = obj.getCoords();
            segments.push({ a: coords[0], b: coords[1] });
            segments.push({ a: coords[1], b: coords[2] });
            segments.push({ a: coords[2], b: coords[3] });
            segments.push({ a: coords[3], b: coords[0] });
        } else if (obj.type === 'ellipse' || obj.type === 'circle') {
            const rx = (obj.rx || obj.width/2) * (obj.scaleX || 1);
            const ry = (obj.ry || obj.height/2) * (obj.scaleY || 1);
            const steps = 32;
            let prev = toCanvas(rx * Math.cos(0), ry * Math.sin(0));
            for (let i = 1; i <= steps; i++) {
                const t = (i / steps) * Math.PI * 2;
                const cur = toCanvas(rx * Math.cos(t), ry * Math.sin(t));
                segments.push({ a: prev, b: cur });
                prev = cur;
            }
        } else if (obj.type === 'group') {
            const groupObjects = obj.getObjects();
            for (const child of groupObjects) {
                if (child.isBackground) continue;
                segments.push(...getShapeSegmentsInCanvasSpace(child));
            }
        }
        return segments;
    }

    function findObjectAtPointer(canvas, pointer) {
        const objects = canvas.getObjects();
        const tolerance = 15;
        for (let i = objects.length - 1; i >= 0; i--) {
            const obj = objects[i];
            if (obj.isEraserMask === true || obj.isBackground) continue;
            const bounds = obj.getBoundingRect();
            if (pointer.x < bounds.left - tolerance || pointer.x > bounds.left + bounds.width + tolerance ||
                pointer.y < bounds.top - tolerance || pointer.y > bounds.top + bounds.height + tolerance) {
                continue;
            }
            if (obj.type === 'path' && obj.path) {
                const localPt = obj.toLocalPoint(new fabric.Point(pointer.x, pointer.y), 'center', 'center');
                const px = localPt.x + (obj.pathOffset ? obj.pathOffset.x : 0);
                const py = localPt.y + (obj.pathOffset ? obj.pathOffset.y : 0);
                const pathData = obj.path;
                const points = [];
                for (const cmd of pathData) {
                    for (let j = 1; j < cmd.length - 1; j += 2) {
                        points.push({ x: cmd[j], y: cmd[j + 1] });
                    }
                }
                let minDist = Infinity;
                for (let j = 0; j < points.length - 1; j++) {
                    minDist = Math.min(minDist, distToSegment({ x: px, y: py }, points[j], points[j + 1]));
                }
                if (minDist < tolerance) return obj;
            } else {
                const segments = getShapeSegmentsInCanvasSpace(obj);
                for (const seg of segments) {
                    if (distToSegment(pointer, seg.a, seg.b) < tolerance) {
                        return obj;
                    }
                }
            }
        }
        return null;
    }

    canvas.on('mouse:move', function(opt) {
        var isDragging = isPointerDown;
        if (currentTool === 'eraser-stroke' && isDragging) {
            const target = canvas.findTarget(opt.e, false);
            if (target && !target.isBackground && target.isEraserMask !== true) {
                canvas.remove(target);
                canvas.requestRenderAll();
                saveHistory();
            }
            return;
        }
        if (currentTool === 'eraser-normal' && isDragging) {
            var pointer = canvas.getPointer(opt.e);
            var sw = parseInt(document.getElementById('widthPicker').value, 10);
            var radius = sw / 2;
            var objects = canvas.getObjects();
            for (var i = 0; i < objects.length; i++) {
                var obj = objects[i];
                if (obj.isBackground) continue;
                var bounds = obj.getBoundingRect();
                var objCenterX = bounds.left + bounds.width / 2;
                var objCenterY = bounds.top + bounds.height / 2;
                var dist = Math.sqrt(Math.pow(pointer.x - objCenterX, 2) + Math.pow(pointer.y - objCenterY, 2));
                if (dist < radius + Math.max(bounds.width, bounds.height) / 2) {
                    affectedObjects.add(obj);
                    var localPoint = obj.toLocalPoint(new fabric.Point(pointer.x, pointer.y), 'center', 'center');
                    var avgScale = (obj.scaleX + obj.scaleY) / 2;
                    var adjustedRadius = radius / avgScale;
                    var erasePoints = objectEraseMap.get(obj);
                    if (!erasePoints) { erasePoints = []; objectEraseMap.set(obj, erasePoints); }
                    erasePoints.push({ x: localPoint.x, y: localPoint.y, radius: adjustedRadius });
                    var circles = erasePoints.map(function(pt) {
                        return new fabric.Circle({ left: pt.x, top: pt.y, radius: pt.radius, originX: 'center', originY: 'center', fill: 'black' });
                    });
                    var newClipGroup = new fabric.Group(circles, { inverted: true, absolutePositioned: false });
                    newClipGroup.set({ width: obj.width, height: obj.height, left: 0, top: 0, originX: 'center', originY: 'center' });
                    newClipGroup.getObjects().forEach(function(c, index) { c.set({ left: erasePoints[index].x, top: erasePoints[index].y }); });
                    obj.clipPath = newClipGroup;
                    obj.dirty = true;
                }
            }
            canvas.requestRenderAll();
            return;
        }
        if (currentTool === 'select') return;
        if (isDragging && (currentTool === 'pen' || currentTool === 'highlight' || currentTool === 'eraser-normal')) {
            canvas.requestRenderAll();
            return;
        }
        if (isPanning) {
            var e = opt.e, vpt = canvas.viewportTransform;
            var clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : (e.changedTouches && e.changedTouches.length > 0 ? e.changedTouches[0].clientX : e.clientX);
            var clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : (e.changedTouches && e.changedTouches.length > 0 ? e.changedTouches[0].clientY : e.clientY);
            if (clientX !== undefined && clientY !== undefined) {
                vpt[4] += clientX - lastPosX;
                vpt[5] += clientY - lastPosY;
                lastPosX = clientX;
                lastPosY = clientY;
            }
            canvas.requestRenderAll(); syncBackground(); return;
        }
        if (activeShape) {
            var pointer = canvas.getPointer(opt.e);
            var isShift = opt.e.shiftKey;
            if (currentTool === 'line') activeShape.set({ x2: pointer.x, y2: pointer.y });
            else if (currentTool === 'rect') {
                var w = Math.abs(pointer.x - startX), h = Math.abs(pointer.y - startY);
                if (isShift) { w = Math.max(w, h); h = w; }
                activeShape.set({ left: startX < pointer.x ? startX : startX - w, top: startY < pointer.y ? startY : startY - h, width: w, height: h });
            } else if (currentTool === 'circle') {
                var rx = Math.abs(pointer.x - startX) / 2, ry = Math.abs(pointer.y - startY) / 2;
                if (isShift) { rx = Math.max(rx, ry); ry = rx; }
                activeShape.set({ rx: rx, ry: ry, left: Math.min(startX, startX + (pointer.x > startX ? rx*2 : -rx*2)), top: Math.min(startY, startY + (pointer.y > startY ? ry*2 : -ry*2)) });
            } else if (currentTool === 'triangle') {
                var w = Math.abs(pointer.x - startX), h = Math.abs(pointer.y - startY);
                if (isShift) { w = Math.max(w, h); h = w; }
                activeShape.set({ left: startX < pointer.x ? startX : startX - w, top: startY < pointer.y ? startY : startY - h, width: w, height: h });
            }
            canvas.requestRenderAll();
        }
        if (currentTool === 'ruler' && rulerStartPoint && isDragging) {
            var pointer = canvas.getPointer(opt.e);
            var dx = pointer.x - rulerStartPoint.x;
            var dy = pointer.y - rulerStartPoint.y;
            var length = Math.sqrt(dx * dx + dy * dy);
            var angle = Math.atan2(dy, dx) * 180 / Math.PI;
            var snappedAngle = Math.round(angle / rulerSnapAngle) * rulerSnapAngle;
            var angleRad = snappedAngle * Math.PI / 180;
            var snappedLength = Math.round(length / rulerSnapLength) * rulerSnapLength;
            var endX = rulerStartPoint.x + Math.cos(angleRad) * snappedLength;
            var endY = rulerStartPoint.y + Math.sin(angleRad) * snappedLength;
            rulerCurrentLine.set({ x2: endX, y2: endY });
            canvas.requestRenderAll();
        }
    });

    canvas.on('mouse:up', function(opt) {
        isPointerDown = false;
        if (isPanning) {
            canvas.setViewportTransform(canvas.viewportTransform);
            isPanning = false; canvasWrapper.classList.remove('cursor-panning');
            if (currentTool === 'select') canvas.selection = true;
        }
        if (activeShape) {
            activeShape.setCoords();
            var isSelect = (currentTool === 'select');
            activeShape.selectable = isSelect; activeShape.evented = isSelect;
            activeShape = null; saveHistory();
        }
        if (currentTool === 'eraser-normal' && affectedObjects.size > 0) {
            affectedObjects.forEach(function(obj) { obj.setCoords(); delete obj._originalErasePoints; });
            saveHistory();
            affectedObjects.clear();
        }
        if (currentTool === 'ruler' && rulerCurrentLine) {
            rulerCurrentLine.setCoords();
            var isSelect = (currentTool === 'select');

    });

                    var originalPoints = obj._originalErasePoints;
                    objectEraseMap.set(obj, JSON.parse(JSON.stringify(originalPoints)));
                    if (originalPoints.length > 0) {
                        var circles = originalPoints.map(function(pt) {
                            return new fabric.Circle({ left: pt.x, top: pt.y, radius: pt.radius, originX: 'center', originY: 'center', fill: 'black' });
                        });
                        var restoredClipGroup = new fabric.Group(circles, { inverted: true, absolutePositioned: false });
                        restoredClipGroup.set({ width: obj.width, height: obj.height, left: 0, top: 0, originX: 'center', originY: 'center' });
                        restoredClipGroup.getObjects().forEach(function(c, index) { c.set({ left: originalPoints[index].x, top: originalPoints[index].y }); });
                        obj.clipPath = restoredClipGroup;
                    } else { objectEraseMap.delete(obj); obj.clipPath = null; }
                    obj.dirty = true;
                    delete obj._originalErasePoints;
                } else { objectEraseMap.delete(obj); obj.clipPath = null; obj.dirty = true; }

            affectedObjects.clear();
        }
    });

    canvas.on('after:render', function(opt) {
        if (!showAxes) return;
        if (!opt || !opt.ctx) return;
        var ctx = opt.ctx;
        var vpt = canvas.viewportTransform;
        var zoom = vpt[0];
        var panX = vpt[4];
        var panY = vpt[5];
        var w = canvas.getWidth();
        var h = canvas.getHeight();
        ctx.save();
        var retina = fabric.devicePixelRatio || window.devicePixelRatio || 1;
        ctx.setTransform(retina, 0, 0, retina, 0, 0);
        var isLight = document.documentElement.classList.contains('light-mode');
        var isMobile = window.innerWidth < 768;
        var RULER_SIZE = isMobile ? 28 : 24;
        var fontSize = isMobile ? 12 : 10;
        var bg = isLight ? '#f8fafc' : '#1e293b';
        var fg = isLight ? '#475569' : '#94a3b8';
        var lineCol = isLight ? '#cbd5e1' : '#334155';
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, RULER_SIZE);
        ctx.fillRect(0, 0, RULER_SIZE, h);
        ctx.strokeStyle = lineCol;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, RULER_SIZE); ctx.lineTo(w, RULER_SIZE);
        ctx.moveTo(RULER_SIZE, 0); ctx.lineTo(RULER_SIZE, h);
        ctx.stroke();
        ctx.fillStyle = fg;
        ctx.strokeStyle = fg;
        ctx.font = fontSize + 'px "Segoe UI", sans-serif';
        var baseStep = isMobile ? 60 : 80;
        var rawStep = baseStep / zoom;
        var magnitude = Math.pow(10, Math.floor(Math.log10(rawStep)));
        var residual = rawStep / magnitude;
        var step;
        if (residual < 1.5) step = 1 * magnitude;
        else if (residual < 3.5) step = 2 * magnitude;
        else if (residual < 7.5) step = 5 * magnitude;
        else step = 10 * magnitude;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        var startX = (RULER_SIZE - panX) / zoom;
        var firstX = Math.ceil(startX / step) * step;
        for (var x = firstX; x * zoom + panX < w; x += step) {
            var sx = x * zoom + panX;
            if (sx < RULER_SIZE) continue;
            ctx.beginPath();
            ctx.moveTo(sx, RULER_SIZE - (isMobile ? 4 : 6));
            ctx.lineTo(sx, RULER_SIZE);
            ctx.stroke();
            ctx.fillText(parseFloat(x.toPrecision(12)).toString(), sx, 2);
        }
        ctx.textBaseline = 'middle';
        var startY = (RULER_SIZE - panY) / zoom;
        var firstY = Math.ceil(startY / step) * step;
        for (var y = firstY; y * zoom + panY < h; y += step) {
            var sy = y * zoom + panY;
            if (sy < RULER_SIZE) continue;
            ctx.beginPath();
            ctx.moveTo(RULER_SIZE - (isMobile ? 4 : 6), sy);
            ctx.lineTo(RULER_SIZE, sy);
            ctx.stroke();
            ctx.save();
            ctx.translate(RULER_SIZE - (isMobile ? 6 : 8), sy);
            ctx.rotate(-Math.PI / 2);
            ctx.textAlign = 'center';
            ctx.fillText(parseFloat(y.toPrecision(12)).toString(), 0, 0);
            ctx.restore();
        }
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, RULER_SIZE, RULER_SIZE);
        ctx.strokeStyle = lineCol;
        ctx.strokeRect(0, 0, RULER_SIZE, RULER_SIZE);
        ctx.restore();
    });

        t.style.cssText = 'position:fixed; bottom:24px; left:50%; transform:translateX(-50%); padding:10px 20px; border-radius:24px; font-size:13px; font-weight:500; z-index:99999; opacity:0; transition:opacity .25s; pointer-events:none; max-width:320px; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,.4);';
        document.body.appendChild(t);
      }
      const colors = { info:'#2d2d3a', ok:'#1a3a1a', warn:'#3a2d00', err:'#3a1a1a' };
      const borders = { info:'#555', ok:'#4ade80', warn:'#fbbf24', err:'#f87171' };
      t.style.background = colors[type] || colors.info;
      t.style.border = '1px solid ' + (borders[type] || borders.info);
      t.style.color = '#e0e0e0';

      t.style.opacity = '1';
      clearTimeout(t._tid);

    }

    function setTool(tool) {
        currentTool = tool;
        document.querySelectorAll('.left-sidebar button:not(#btnToggleAxes), .top-bar button:not(#btnCalcToggle)').forEach(b => b.classList.remove('active'));
        canvas.isDrawingMode = false; canvas.selection = false;
        canvas.discardActiveObject && canvas.discardActiveObject();
        canvasWrapper.classList.remove('cursor-pen', 'cursor-eraser', 'cursor-pan', 'cursor-text', 'cursor-cross');
        canvas.forEachObject(o => { o.selectable = false; o.evented = false; o.hoverCursor = 'crosshair'; });
        let btnMap = { 'pen':'btnPen', 'highlight':'btnHighlight', 'text':'btnText', 'eraser-stroke':'btnEraserStroke', 'eraser-normal':'btnEraserNormal', 'select':'btnSelect', 'pan':'btnPan', 'line':'menuBtnLine', 'rect':'menuBtnRect', 'circle':'menuBtnCircle', 'triangle':'menuBtnTriangle', 'ruler':'btnRuler' };
        let targetBtnId = btnMap[tool];
        if (targetBtnId) { let btn = document.getElementById(targetBtnId); if (btn) btn.classList.add('active'); }
        if (tool === 'pen') {
            canvas.isDrawingMode = true; canvas.freeDrawingBrush = standardBrush;
            canvas.freeDrawingBrush.color = document.getElementById('colorPicker').value;
            canvas.freeDrawingBrush.width = parseInt(document.getElementById('widthPicker').value, 10);
            canvasWrapper.classList.add('cursor-pen');
            canvas.renderAll();
        } else if (tool === 'highlight') {
            canvas.isDrawingMode = true; canvas.freeDrawingBrush = new fabric.PencilBrush(canvas);
            canvas.freeDrawingBrush.color = hexToRgba(document.getElementById('colorPicker').value, 0.3);
            canvas.freeDrawingBrush.width = parseInt(document.getElementById('widthPicker').value, 10) * 2;
            canvasWrapper.classList.add('cursor-pen');
            canvas.renderAll();
        } else if (tool === 'eraser-normal') {
            canvas.isDrawingMode = false;
            canvasWrapper.classList.add('cursor-eraser');
            canvas.renderAll();
        } else if (tool === 'text') { canvasWrapper.classList.add('cursor-text'); }
        else if (tool === 'eraser-stroke') {
            canvas.isDrawingMode = false;
            canvasWrapper.classList.add('cursor-eraser');
            canvas.forEachObject(o => { if (o.isEraserMask !== true) { o.evented = true; o.selectable = false; } });
        } else if (tool === 'select') {
            canvas.selection = true;
            canvas.forEachObject(o => { if (o.isEraserMask !== true) { o.selectable = true; o.evented = true; o.hoverCursor = 'move'; } });
        } else if (tool === 'pan') { canvasWrapper.classList.add('cursor-pan'); }
        else if (['line', 'rect', 'circle', 'triangle'].includes(tool)) { canvasWrapper.classList.add('cursor-cross'); }
        const contextMenu = document.getElementById('contextMenu');
        const showColorControls = ['pen', 'highlight', 'text', 'line', 'rect', 'circle', 'triangle', 'ruler'].includes(tool);
        if (contextMenu) contextMenu.classList.toggle('hidden', !showColorControls);
        canvas.requestRenderAll();
    }

    function plotFunction(exprStr, xMin, xMax, color) {
      let fn;
      try { fn = math.compile(exprStr); } catch(e) { throw new Error('Sintaxis inválida'); }
      const STEPS = 800;
      const pts = [];
      for (let i = 0; i <= STEPS; i++) {
        const x = xMin + (xMax - xMin) * i / STEPS;
        try { const y = fn.evaluate({ x }); if (typeof y === 'number' && isFinite(y)) pts.push({ x, y }); else pts.push(null); }
        catch { pts.push(null); }
      }
      if (pts.filter(Boolean).length < 2) throw new Error('Sin puntos válidos en el rango');
      const yVals = pts.filter(Boolean).map(p => p.y);
      const yMean = yVals.reduce((a,b) => a+b) / yVals.length;
      const yStd  = Math.sqrt(yVals.reduce((a,b) => a + (b-yMean)**2, 0) / yVals.length);
      const yMin  = Math.max(Math.min(...yVals), yMean - 4*yStd);
      const yMax  = Math.min(Math.max(...yVals), yMean + 4*yStd);
      const margin = 50;
      const plotW  = canvas.getWidth()  - margin * 2;
      const plotH  = canvas.getHeight() - margin * 2;
      const vpt    = canvas.viewportTransform;
      const toX = x  => margin + (x - xMin)  / (xMax - xMin) * plotW;
      const toY = y  => margin + plotH - (y - yMin) / (yMax - yMin) * plotH;
      const offX = (-vpt[4]) / vpt[0] + canvas.getWidth()  * 0.05;
      const offY = (-vpt[5]) / vpt[3] + canvas.getHeight() * 0.05;
      const BASE_LEFT = offX;
      const BASE_TOP  = offY;
      const group = [];
      group.push(new fabric.Rect({ left: BASE_LEFT, top: BASE_TOP, width: plotW + margin * 2, height: plotH + margin * 2, fill: 'rgba(0,0,0,0.35)', stroke: 'rgba(255,255,255,0.08)', strokeWidth: 1, rx: 6, ry: 6, selectable: false, evented: false }));
      const axisY = yMin <= 0 && yMax >= 0 ? toY(0) : toY(yMin);
      group.push(new fabric.Line([BASE_LEFT + margin, BASE_TOP + axisY, BASE_LEFT + margin + plotW, BASE_TOP + axisY], { stroke:'rgba(255,255,255,0.25)', strokeWidth:1, selectable:false, evented:false }));
      const axisX = xMin <= 0 && xMax >= 0 ? toX(0) : toX(xMin);
      group.push(new fabric.Line([BASE_LEFT + axisX, BASE_TOP + margin, BASE_LEFT + axisX, BASE_TOP + margin + plotH], { stroke:'rgba(255,255,255,0.25)', strokeWidth:1, selectable:false, evented:false }));
      const xTicks = 5;
      for (let i = 0; i <= xTicks; i++) {
        const xv = xMin + (xMax - xMin) * i / xTicks;
        const cx = BASE_LEFT + toX(xv);
        const cy = BASE_TOP  + axisY;
        group.push(new fabric.Text(xv.toFixed(1), { left: cx - 12, top: cy + 4, fontSize: 9, fill: 'rgba(255,255,255,0.4)', selectable: false, evented: false }));
      }
      let seg = [];
      const flush = () => {
        if (seg.length >= 2) {
          const polyPts = seg.map(p => ({ x: BASE_LEFT + toX(p.x), y: BASE_TOP + toY(p.y) }));
          group.push(new fabric.Polyline(polyPts, { fill: 'transparent', stroke: color, strokeWidth: 2, selectable: false, evented: false }));
        }
        seg = [];
      };
      for (const p of pts) {
        if (p === null) { flush(); continue; }
        if (seg.length > 0) { const prev = seg[seg.length-1]; if (Math.abs(p.y - prev.y) > (yMax-yMin) * 0.5) { flush(); } }
        seg.push(p);
      }
      flush();
      group.push(new fabric.Text('f(x) = ' + exprStr, { left: BASE_LEFT + margin + 4, top: BASE_TOP + 6, fontSize: 12, fill: color, fontFamily: 'monospace', selectable: false, evented: false }));
      const grp = new fabric.Group(group, { selectable: true, evented: true });
      canvas.add(grp); canvas.setActiveObject(grp); canvas.requestRenderAll();
      const funcData = { expr: exprStr, xMin, xMax, color, group: grp };
      plottedFunctions.push(funcData);
      updatePlottedFunctionsList();
      saveHistory();
      showToast('📈 f(x) = ' + exprStr + ' graficada', 'ok');
      return funcData;
    }

    function calcUpdate(append) {
        if (append !== undefined) calcExpression += append;
        exprDisplay.textContent = calcExpression;
        if (!calcExpression) { resDisplay.textContent = '0'; return; }
        try {
            var evalExpr = calcExpression.replace(/×/g, '*').replace(/÷/g, '/');
            var openP = (evalExpr.match(/\(/g) || []).length, closeP = (evalExpr.match(/\)/g) || []).length;
            for(var i = 0; i < openP - closeP; i++) evalExpr += ')';
            var res = math.evaluate(evalExpr);
            if (res !== undefined && typeof res !== 'function') resDisplay.textContent = math.format(res, { precision: 14 });
        } catch (ex) {}
    }

    function addToHistory(expression, result) {

    }

    function updateCalcHistoryUI() {
        const historyList = document.getElementById('calcHistoryList');
        if (!historyList) return;

            const date = new Date(item.timestamp);
            const timeStr = date.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
            return '<div class="calc-history-item" data-index="' + (calcHistory.length - 1 - index) + '" draggable="true"><div class="history-expr">' + timeStr + ' — ' + item.expression + '</div><div class="history-result">= ' + item.result + '</div></div>';

        historyList.querySelectorAll('.calc-history-item').forEach(item => {
            item.addEventListener('click', function() {

        if (e.code === 'KeyP' && !e.ctrlKey) setTool('pen');

    async function doAutoSave() {
      try {
        const json = JSON.stringify(canvas.toJSON(['isEraserMask']));
        if (json.length > 4_000_000) { showToast('⚠ Sesión muy grande para autoguardado', 'warn'); return; }
        await db.autosave.put({ key: AS_KEY, value: json, timestamp: Date.now() });
        await db.autosave.put({ key: AS_TS, value: Date.now().toString(), timestamp: Date.now() });
        showToast('💾 Guardado automáticamente', 'info', 1800);
      } catch(e) { console.error('Error en autoguardado:', e); showToast('Autoguardado falló (almacenamiento lleno?)', 'warn'); }
    }

    function scheduleAutoSave() { clearTimeout(autoSaveTimer); autoSaveTimer = setTimeout(doAutoSave, AS_DELAY); }

    async function setupRecoveryBar() {
      try {
        const savedRecord = await db.autosave.get(AS_KEY);
        const tsRecord = await db.autosave.get(AS_TS);
        const saved = savedRecord ? savedRecord.value : null;
        const ts = tsRecord ? tsRecord.value : null;
        if (!saved || !ts) return;
        if (!canvas || !canvas.toJSON) { console.error('Canvas no está listo para recuperar sesión'); return; }
        const fecha = new Date(parseInt(ts)).toLocaleString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
        const recoverBar = document.getElementById('recoverBar');
        const recoverDate = document.getElementById('recoverDate');
        if (!recoverBar || !recoverDate) { console.error('Elementos de recuperación no encontrados'); return; }
        recoverDate.textContent = fecha;
        recoverBar.style.display = 'flex';
        recoverBar.style.visibility = 'visible';
        recoverBar.style.opacity = '1';
        const btnRecover = document.getElementById('btnDoRecover');
        const btnDiscard = document.getElementById('btnDiscardRecover');
        if (btnRecover) {
          btnRecover.onclick = async function() {
            try { recoverBar.style.display = 'none'; await canvas.loadFromJSON(saved); canvas.requestRenderAll(); saveHistory(); showToast('✅ Sesión recuperada', 'ok'); }
            catch (e) { showToast('❌ Error al recuperar la sesión.', 'err'); console.error(e); }
          };
        }
        if (btnDiscard) {
          btnDiscard.onclick = async function() {
            try { await db.autosave.delete(AS_KEY); await db.autosave.delete(AS_TS); recoverBar.style.display = 'none'; showToast('Sesión descartada', 'info'); }
            catch (e) { showToast('❌ Error al descartar la sesión.', 'err'); console.error(e); }
          };
        }
        console.log('Barra de recuperación configurada correctamente');
      } catch (e) { console.error("Error setting up recovery bar:", e); }
    }

    setTimeout(setupRecoveryBar, 500);
});
    </script>
</body>
